server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: auto-shorts-ai
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/autoshorts}
    username: ${SPRING_DATASOURCE_USERNAME:autoshorts}
    password: ${SPRING_DATASOURCE_PASSWORD:autoshorts}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
  jackson:
    default-property-inclusion: non_null
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:autoshorts}
    password: ${SPRING_RABBITMQ_PASSWORD:autoshorts}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS:health,info,prometheus,metrics}
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  prometheus:
    metrics:
      export:
        enabled: ${MANAGEMENT_PROMETHEUS_ENABLED:true}

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 8
        failure-rate-threshold: 60
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
    instances:
      ai-providers:
        base-config: default
      tiktok:
        base-config: default
      social-publish:
        base-config: default
      stripe:
        base-config: default

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${SENTRY_ENVIRONMENT:${SPRING_PROFILES_ACTIVE:local}}
  release: ${SENTRY_RELEASE:auto-shorts-ai@0.1.0}
  traces-sample-rate: ${SENTRY_TRACES_SAMPLE_RATE:0.0}
  send-default-pii: false
  # When dsn is blank the SDK initializes as a no-op, so this is safe in local/dev.

logging:
  level:
    root: INFO
    com.autoshorts.ai: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] %logger - %msg%n"

app:
  working-dir: ${APP_WORKING_DIR:./work}
  cleanup:
    delete-temp-files: ${APP_CLEANUP_DELETE_TEMP_FILES:true}
    keep-failed-job-files: ${APP_CLEANUP_KEEP_FAILED_JOB_FILES:true}
  assets:
    default-background-path: ${APP_ASSETS_DEFAULT_BACKGROUND_PATH:./assets/backgrounds/default.mp4}
  ffmpeg:
    binary: ${APP_FFMPEG_BINARY:${FFMPEG_PATH:ffmpeg}}
    timeout-seconds: ${APP_FFMPEG_TIMEOUT_SECONDS:180}
  redis:
    cache-enabled: ${APP_REDIS_CACHE_ENABLED:true}
    cache-ttl-seconds: ${APP_REDIS_CACHE_TTL_SECONDS:21600}
  openai:
    base-url: ${AI_BASE_URL:${OPENAI_BASE_URL:https://api.openai.com/v1}}
    api-key: ${apikey:${OPENAI_API_KEY:}}
    model: ${AI_MODEL:${OPENAI_MODEL:if/qwen3-coder-plus}}
    speech-model: ${AI_TTS_MODEL:google-tts/vi}
    speech-voice: ${AI_TTS_VOICE:}
    speech-response-format: ${AI_TTS_RESPONSE_FORMAT:mp3}
    request-timeout-ms: ${AI_REQUEST_TIMEOUT_MS:${OPENAI_REQUEST_TIMEOUT_MS:60000}}
    speech-request-timeout-ms: ${AI_TTS_REQUEST_TIMEOUT_MS:${AI_REQUEST_TIMEOUT_MS:60000}}
    mock: ${OPENAI_MOCK:false}
  text:
    provider: ${APP_TEXT_PROVIDER:huggingface}
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-opus-4-8}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:4000}
    base-url: ${ANTHROPIC_BASE_URL:}
  huggingface:
    base-url: ${HUGGINGFACE_BASE_URL:https://router.huggingface.co}
    api-token: ${HUGGINGFACE_API_TOKEN:}
    provider: ${HF_PROVIDER:hf-inference}
    text-provider: ${HF_TEXT_PROVIDER:${HF_PROVIDER:hf-inference}}
    image-provider: ${HF_IMAGE_PROVIDER:${HF_PROVIDER:hf-inference}}
    video-provider: ${HF_VIDEO_PROVIDER:fal-ai}
    tts-provider: ${HF_TTS_PROVIDER:${HF_PROVIDER:hf-inference}}
    text-model: ${HF_TEXT_MODEL:Qwen/Qwen2.5-7B-Instruct}
    image-model: ${HF_IMAGE_MODEL:black-forest-labs/FLUX.1-schnell}
    video-model: ${HF_VIDEO_MODEL:Wan-AI/Wan2.2-T2V-A14B}
    tts-model: ${HF_TTS_MODEL:}
    request-timeout-ms: ${HUGGINGFACE_REQUEST_TIMEOUT_MS:300000}
  visual:
    enabled: ${APP_VISUAL_ENABLED:true}
    mock: ${APP_VISUAL_MOCK:false}
    provider: ${APP_VISUAL_PROVIDER:huggingface-video}
    model: ${APP_VISUAL_MODEL:gpt-image-1}
    size: ${APP_VISUAL_SIZE:1024x1536}
    max-scenes: ${APP_VISUAL_MAX_SCENES:5}
    request-timeout-ms: ${APP_VISUAL_REQUEST_TIMEOUT_MS:${AI_REQUEST_TIMEOUT_MS:60000}}
  elevenlabs:
    enabled: ${ELEVENLABS_ENABLED:true}
    provider: ${ELEVENLABS_PROVIDER:huggingface}
    base-url: ${ELEVENLABS_BASE_URL:https://api.elevenlabs.io}
    api-key: ${ELEVENLABS_API_KEY:}
    default-voice-id: ${AI_TTS_VOICE:${ELEVENLABS_DEFAULT_VOICE_ID:}}
    default-model-id: ${AI_TTS_MODEL:${ELEVENLABS_DEFAULT_MODEL_ID:${ELEVENLABS_MODEL_ID:google-tts/vi}}}
    output-format: ${AI_TTS_RESPONSE_FORMAT:${ELEVENLABS_OUTPUT_FORMAT:mp3}}
    request-timeout-ms: ${AI_TTS_REQUEST_TIMEOUT_MS:${ELEVENLABS_REQUEST_TIMEOUT_MS:60000}}
    mock: ${ELEVENLABS_MOCK:false}
  storage:
    mock: ${S3_MOCK:true}
    region: ${S3_REGION:us-east-1}
    bucket: ${S3_BUCKET:autoshorts-assets}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    public-base-url: ${S3_PUBLIC_BASE_URL:http://localhost:9000/autoshorts-assets}
    local-public-base-url: ${APP_STORAGE_LOCAL_PUBLIC_BASE_URL:http://localhost:${SERVER_PORT:8080}}
    presign-duration-seconds: ${S3_PRESIGN_DURATION_SECONDS:86400}
  scheduler:
    enabled: ${APP_SCHEDULER_ENABLED:false}
    fixed-delay-ms: ${APP_SCHEDULER_FIXED_DELAY_MS:60000}
    initial-delay-ms: ${APP_SCHEDULER_INITIAL_DELAY_MS:15000}
    batch-size: ${APP_SCHEDULER_BATCH_SIZE:3}
    default-duration-seconds: ${APP_SCHEDULER_DEFAULT_DURATION_SECONDS:30}
    default-voice-id: ${APP_SCHEDULER_DEFAULT_VOICE_ID:}
    topic-source: ${APP_SCHEDULER_TOPIC_SOURCE:scheduler}
  queue:
    enabled: ${APP_QUEUE_ENABLED:true}
    exchange: ${APP_QUEUE_EXCHANGE:autoshorts.video.exchange}
    routing-key: ${APP_QUEUE_ROUTING_KEY:video.generate}
    queue: ${APP_QUEUE_NAME:autoshorts.video.generate}
    dead-letter-exchange: ${APP_QUEUE_DEAD_LETTER_EXCHANGE:autoshorts.video.dlx}
    dead-letter-routing-key: ${APP_QUEUE_DEAD_LETTER_ROUTING_KEY:video.generate.dlq}
    dead-letter-queue: ${APP_QUEUE_DEAD_LETTER_NAME:autoshorts.video.generate.dlq}
    consumer-concurrency: ${APP_QUEUE_CONSUMER_CONCURRENCY:2}
    max-processing-attempts: ${APP_QUEUE_MAX_PROCESSING_ATTEMPTS:3}
    retry-initial-interval-ms: ${APP_QUEUE_RETRY_INITIAL_INTERVAL_MS:2000}
    retry-multiplier: ${APP_QUEUE_RETRY_MULTIPLIER:2.0}
    retry-max-interval-ms: ${APP_QUEUE_RETRY_MAX_INTERVAL_MS:10000}
    recovery-enabled: ${APP_QUEUE_RECOVERY_ENABLED:true}
    stuck-processing-timeout-minutes: ${APP_QUEUE_STUCK_PROCESSING_TIMEOUT_MINUTES:30}
    pending-redispatch-delay-minutes: ${APP_QUEUE_PENDING_REDISPATCH_DELAY_MINUTES:5}
    recovery-batch-size: ${APP_QUEUE_RECOVERY_BATCH_SIZE:50}
  publish:
    enabled: ${APP_PUBLISH_ENABLED:true}
    provider: ${APP_PUBLISH_PROVIDER:mock}
    default-platform: ${APP_PUBLISH_DEFAULT_PLATFORM:mock-social}
    mock-failure-keyword: ${APP_PUBLISH_MOCK_FAILURE_KEYWORD:[publish-fail]}
    mock-latency-ms: ${APP_PUBLISH_MOCK_LATENCY_MS:50}
  tiktok:
    client-key: ${TIKTOK_CLIENT_KEY:}
    client-secret: ${TIKTOK_CLIENT_SECRET:}
    redirect-uri: ${TIKTOK_REDIRECT_URI:http://localhost:8080/api/integrations/tiktok/callback}
    scopes: ${TIKTOK_SCOPES:user.info.basic,video.publish}
    webhook-verify-token: ${TIKTOK_WEBHOOK_VERIFY_TOKEN:}
    api-base-url: ${TIKTOK_API_BASE_URL:https://open.tiktokapis.com}
    auth-base-url: ${TIKTOK_AUTH_BASE_URL:https://www.tiktok.com}
    frontend-return-url: ${TIKTOK_FRONTEND_RETURN_URL:http://localhost:3000/app/integrations/tiktok}
    direct-publish-enabled: ${TIKTOK_DIRECT_PUBLISH_ENABLED:false}
    status-poll-fixed-delay-ms: ${TIKTOK_STATUS_POLL_FIXED_DELAY_MS:30000}
    status-poll-batch-size: ${TIKTOK_STATUS_POLL_BATCH_SIZE:25}
    status-timeout-minutes: ${TIKTOK_STATUS_TIMEOUT_MINUTES:60}
  youtube:
    client-id: ${YOUTUBE_CLIENT_ID:}
    client-secret: ${YOUTUBE_CLIENT_SECRET:}
    redirect-uri: ${YOUTUBE_REDIRECT_URI:http://localhost:8080/api/integrations/youtube/callback}
    scopes: ${YOUTUBE_SCOPES:https://www.googleapis.com/auth/youtube.upload}
    api-base-url: ${YOUTUBE_API_BASE_URL:https://www.googleapis.com}
    auth-base-url: ${YOUTUBE_AUTH_BASE_URL:https://accounts.google.com/o/oauth2/v2/auth}
    frontend-return-url: ${YOUTUBE_FRONTEND_RETURN_URL:http://localhost:3000/app/integrations/youtube}
    direct-publish-enabled: ${YOUTUBE_DIRECT_PUBLISH_ENABLED:false}
    status-poll-fixed-delay-ms: ${YOUTUBE_STATUS_POLL_FIXED_DELAY_MS:30000}
    status-poll-batch-size: ${YOUTUBE_STATUS_POLL_BATCH_SIZE:25}
    status-timeout-minutes: ${YOUTUBE_STATUS_TIMEOUT_MINUTES:60}
  instagram:
    client-id: ${INSTAGRAM_CLIENT_ID:}
    client-secret: ${INSTAGRAM_CLIENT_SECRET:}
    redirect-uri: ${INSTAGRAM_REDIRECT_URI:http://localhost:8080/api/integrations/instagram/callback}
    scopes: ${INSTAGRAM_SCOPES:instagram_basic,instagram_content_publish,pages_show_list}
    api-base-url: ${INSTAGRAM_API_BASE_URL:https://graph.facebook.com}
    auth-base-url: ${INSTAGRAM_AUTH_BASE_URL:https://www.facebook.com/dialog/oauth}
    frontend-return-url: ${INSTAGRAM_FRONTEND_RETURN_URL:http://localhost:3000/app/integrations/instagram}
    direct-publish-enabled: ${INSTAGRAM_DIRECT_PUBLISH_ENABLED:false}
    status-poll-fixed-delay-ms: ${INSTAGRAM_STATUS_POLL_FIXED_DELAY_MS:30000}
    status-poll-batch-size: ${INSTAGRAM_STATUS_POLL_BATCH_SIZE:25}
    status-timeout-minutes: ${INSTAGRAM_STATUS_TIMEOUT_MINUTES:60}
  webhook:
    enabled: ${APP_WEBHOOK_ENABLED:false}
    endpoint-url: ${APP_WEBHOOK_ENDPOINT_URL:}
    dispatch-batch-size: ${APP_WEBHOOK_DISPATCH_BATCH_SIZE:20}
    dispatch-fixed-delay-ms: ${APP_WEBHOOK_DISPATCH_FIXED_DELAY_MS:5000}
    max-attempts: ${APP_WEBHOOK_MAX_ATTEMPTS:5}
    retry-initial-delay-ms: ${APP_WEBHOOK_RETRY_INITIAL_DELAY_MS:1000}
    retry-multiplier: ${APP_WEBHOOK_RETRY_MULTIPLIER:2.0}
    retry-max-delay-ms: ${APP_WEBHOOK_RETRY_MAX_DELAY_MS:60000}
    request-timeout-seconds: ${APP_WEBHOOK_REQUEST_TIMEOUT_SECONDS:10}
  billing:
    stripe-enabled: ${STRIPE_ENABLED:false}
    stripe-api-base-url: ${STRIPE_API_BASE_URL:https://api.stripe.com}
    stripe-secret-key: ${STRIPE_SECRET_KEY:}
    stripe-webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/app/billing?checkout=success}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/app/billing?checkout=cancelled}
    portal-return-url: ${STRIPE_PORTAL_RETURN_URL:http://localhost:3000/app/billing}
    starter-price-id: ${STRIPE_STARTER_PRICE_ID:}
    pro-price-id: ${STRIPE_PRO_PRICE_ID:}
    agency-price-id: ${STRIPE_AGENCY_PRICE_ID:}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    auth-per-minute: ${APP_RATE_LIMIT_AUTH_PER_MINUTE:20}
    generate-per-minute: ${APP_RATE_LIMIT_GENERATE_PER_MINUTE:10}
    default-per-minute: ${APP_RATE_LIMIT_DEFAULT_PER_MINUTE:300}
  web:
    cors:
      allowed-origins: ${APP_WEB_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
      allowed-methods: ${APP_WEB_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${APP_WEB_CORS_ALLOWED_HEADERS:*}
      exposed-headers: ${APP_WEB_CORS_EXPOSED_HEADERS:Location}
      allow-credentials: ${APP_WEB_CORS_ALLOW_CREDENTIALS:true}
      max-age-seconds: ${APP_WEB_CORS_MAX_AGE_SECONDS:3600}
  security:
    jwt-secret: ${APP_JWT_SECRET:replace-this-with-a-long-jwt-secret-for-local-dev}
    token-ttl-seconds: ${APP_JWT_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${APP_JWT_REFRESH_TOKEN_TTL_SECONDS:2592000}
    lockout-threshold: ${APP_AUTH_LOCKOUT_THRESHOLD:5}
    lockout-minutes: ${APP_AUTH_LOCKOUT_MINUTES:15}
    token-encryption-key: ${APP_TOKEN_ENCRYPTION_KEY:}
