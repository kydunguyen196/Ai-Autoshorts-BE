name: Deploy (Render)

# Triggers the Render deploy hook only after Backend CI succeeds on main.
# Configure the secret RENDER_DEPLOY_HOOK_URL in repo settings (Settings → Secrets → Actions).
on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  deploy:
    name: Trigger Render deploy
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Call Render deploy hook
        env:
          HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "RENDER_DEPLOY_HOOK_URL secret not set — skipping deploy."
            exit 0
          fi
          echo "Triggering Render deploy..."
          curl -fsS -X POST "$HOOK_URL"
          echo "Deploy triggered."
